<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mozart Unified Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.15);
            --accent: #06b6d4;
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-card-hover: rgba(51, 65, 85, 0.7);
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: rgba(148, 163, 184, 0.1);
            --border-light: rgba(148, 163, 184, 0.2);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --danger: #f43f5e;
            --danger-bg: rgba(244, 63, 94, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --info: #3b82f6;
            --info-bg: rgba(59, 130, 246, 0.1);
            --sidebar-width: 260px;
            --radius: 16px;
            --radius-sm: 10px;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            line-height: 1.6;
        }
        /* Animated background mesh */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(244, 63, 94, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            position: fixed;
            top: 0; left: 0; bottom: 0;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 28px 24px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .sidebar-header p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }
        .nav-list {
            list-style: none;
            padding: 16px 12px;
            flex: 1;
        }
        .nav-list li {
            margin-bottom: 4px;
        }
        .nav-list li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
        }
        .nav-list li a:hover {
            background: rgba(99, 102, 241, 0.08);
            color: var(--text);
            transform: translateX(2px);
        }
        .nav-list li a.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(6, 182, 212, 0.1));
            color: #fff;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }
        .nav-icon {
            width: 22px;
            text-align: center;
            font-size: 16px;
        }
        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 36px 40px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }
        .page-header {
            margin-bottom: 32px;
        }
        .page-header h2 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .page-header p {
            color: var(--text-secondary);
            margin-top: 6px;
            font-size: 14px;
        }
        /* Cards */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 28px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: var(--border-light);
        }
        .card h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        /* Forms */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .form-group input::placeholder { color: var(--text-muted); }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow), 0 0 20px rgba(99, 102, 241, 0.05);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.2px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: #fff;
            box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3);
        }
        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }
        .btn-secondary:hover {
            background: rgba(51, 65, 85, 0.8);
            color: var(--text);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        /* Results Table */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .results-table th {
            background: rgba(15, 23, 42, 0.5);
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .results-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .results-table tr:hover td {
            background: rgba(99, 102, 241, 0.03);
            color: var(--text);
        }
        /* Status badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .badge-success { background: var(--success-bg); color: var(--success); }
        .badge-danger { background: var(--danger-bg); color: var(--danger); }
        .badge-warning { background: var(--warning-bg); color: var(--warning); }
        .badge-info { background: var(--info-bg); color: var(--info); }
        /* Loading */
        .loading {
            display: none;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 12px;
        }
        .loading.show { display: flex; }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-light);
            border-top-color: var(--primary-light);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Alert */
        .alert {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
            font-weight: 500;
        }
        .alert.show { display: block; }
        .alert-error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid rgba(244, 63, 94, 0.2);
        }
        .alert-success {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        /* File Upload */
        .file-drop {
            border: 2px dashed var(--border-light);
            border-radius: var(--radius);
            padding: 44px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.3);
        }
        .file-drop:hover,
        .file-drop.dragover {
            border-color: var(--primary-light);
            background: var(--primary-glow);
        }
        .file-drop p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .file-drop .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        /* Stat boxes */
        .stat-box {
            padding: 20px;
            border-radius: var(--radius-sm);
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-box .stat-value {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .stat-box .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        /* Code tag */
        code {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-light);
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
        }
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 64px; }
            .sidebar-header h1, .sidebar-header p, .nav-list li a span:not(.nav-icon) { display: none; }
            .main-content { margin-left: 64px; padding: 20px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h1>Mozart Tools</h1>
            <p>Unified Dashboard</p>
        </div>
        <ul class="nav-list">
            <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">
                <span class="nav-icon">⚡</span><span>Dashboard</span>
            </a></li>
            <li><a href="/milestone-audit" class="{% if request.path == '/milestone-audit' %}active{% endif %}">
                <span class="nav-icon">📊</span><span>Milestone Audit</span>
            </a></li>
            <li><a href="/failure-analyzer" class="{% if request.path == '/failure-analyzer' %}active{% endif %}">
                <span class="nav-icon">🔍</span><span>Failure Analyzer</span>
            </a></li>
            <li><a href="/testrail-mapping" class="{% if request.path == '/testrail-mapping' %}active{% endif %}">
                <span class="nav-icon">🔗</span><span>TestRail Mapping</span>
            </a></li>
            <li><a href="/skip-tool" class="{% if request.path == '/skip-tool' %}active{% endif %}">
                <span class="nav-icon">⏭️</span><span>Skip Tool</span>
            </a></li>
            <li><a href="/auto-rebase" class="{% if request.path == '/auto-rebase' %}active{% endif %}">
                <span class="nav-icon">🔄</span><span>Auto Rebase</span>
            </a></li>
            <li><a href="/cr-analyzer" class="{% if request.path == '/cr-analyzer' %}active{% endif %}">
                <span class="nav-icon">💬</span><span>CR Analyzer</span>
            </a></li>
            <li><a href="/branch-manager" class="{% if request.path == '/branch-manager' %}active{% endif %}">
                <span class="nav-icon">🌿</span><span>Branch Manager</span>
            </a></li>
        </ul>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
